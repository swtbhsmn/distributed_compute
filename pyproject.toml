[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-compute-poc"
version = "0.1.0"
description = "In-memory distributed compute proof of concept"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "psutil>=5.9,<8",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
compute-coordinator = "distributed_compute.coordinator:main"
compute-worker = "distributed_compute.worker:main"

[tool.setuptools.packages.find]
include = ["distributed_compute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

